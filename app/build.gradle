plugins {
    id 'com.android.application'
}

android {
    namespace 'com.barakah.time'
    compileSdk 34

    defaultConfig {
        applicationId 'com.barakah.time'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // A fixed key so every new build installs as an update over the old one.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}

// No external libraries: the app uses only the Android framework.
